# Development-only settings. Activate with SPRING_PROFILES_ACTIVE=dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
logging.level.com.example.ecommerce=DEBUG

# Dev-only JWT secret so the app starts without exporting JWT_SECRET.
# JWT_SECRET still wins when set. Never use this profile in production.
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-production}

# Dev-only mail: Mailpit from compose.yaml (SMTP localhost:1025, inbox http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@ecommerce.local}
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
