spring.application.name=ecommerce

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Mail (SMTP). MAIL_HOST, MAIL_FROM and PASSWORD_RESET_URL are required: the app refuses to start
# without them instead of silently sending nothing or emailing localhost links. The dev profile sets them.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM}
# Emails are sent asynchronously and are best-effort: an SMTP outage must not mark the app DOWN
management.health.mail.enabled=false

# Password reset: frontend page that receives ?token=... and calls POST /api/auth/reset-password
app.password-reset.url=${PASSWORD_RESET_URL}

# Server Configuration
server.port=8080
# Trust X-Forwarded-* only from private-network proxies (Tomcat RemoteIpValve defaults)
server.forward-headers-strategy=native

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.example.ecommerce=INFO

# Initial admin, created on startup when both are set (never promotes an existing user)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Checkout pricing: tax as a fraction of the subtotal (0.0825 = 8.25%) and a flat shipping fee
app.pricing.tax-rate=${TAX_RATE:0}
app.pricing.shipping-fee=${SHIPPING_FEE:0}

# Unpaid orders hold their stock. After the TTL they are cancelled and the stock returns to sale.
# A customer may have at most max-pending-per-user unpaid orders open at once.
app.orders.pending-ttl=${ORDER_PENDING_TTL:30m}
app.orders.max-pending-per-user=${ORDER_MAX_PENDING_PER_USER:3}
app.orders.expiry-check-interval-ms=${ORDER_EXPIRY_CHECK_INTERVAL_MS:60000}
